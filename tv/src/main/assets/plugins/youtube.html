<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
<iframe
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share;"
        allowfullscreen="true"
        allow="fullscreen"
        src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=0&fs=1&rel=0"
>
</iframe>
<script>
    try{
        window.AndroidBridge.changeVideoResolution(1280 ,720);
     }catch(e){}
</script>
</body>
</html>
